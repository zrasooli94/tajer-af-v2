[phases.setup]
nixPkgs = ['nodejs_20', 'php84', 'php84Packages.composer']

[phases.install]
cmds = [
  'composer install --no-dev --optimize-autoloader --no-interaction'
]

[phases.build]
cmds = [
  'npm ci',
  'npm run build',
  'php artisan config:cache',
  'php artisan route:cache',
  'php artisan view:cache'
]

[start]
cmd = 'php artisan migrate --force --no-interaction && php artisan db:seed --force --no-interaction > /dev/null 2>&1; php -S 0.0.0.0:$PORT -t public'